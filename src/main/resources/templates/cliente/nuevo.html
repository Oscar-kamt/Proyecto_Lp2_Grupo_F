<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Nuevo Cliente</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		.form-control {

			border: 2px solid #6c757d;

		}

		.form-control:focus {

			border-color: #212529;
			box-shadow: none;

		}
	</style>

</head>

<body>
	
	<div th:replace="fragments/navbar :: navbar"></div>

	<div class="container mt-4">

		<div class="card shadow p-4">

			<h2 class="mb-4">

				Registrar Cliente

			</h2>

			<form id="frmCliente" th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

				<div class="mb-3">

					<label class="form-label fw-bold">

						Nombre :

					</label>

					<input class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre">

				</div>

				<div class="mb-3">

					<label class="form-label fw-bold">

						DNI :

					</label>

					<input class="form-control" th:field="*{dni}" id="dni" placeholder="Ingrese el DNI">

					<div id="errorDni" th:if="${errorDni}" class="text-danger mt-1">

						<span th:text="${errorDni}"></span>

					</div>
				</div>

				<div class="mb-3">

					<label class="form-label fw-bold">

						Teléfono :

					</label>

					<input id="telefono" class="form-control" th:field="*{telefono}" placeholder="Ingrese el teléfono">

					<div id="errorTelefono" th:if="${errorTelefono}" class="text-danger mt-1">
						<span th:text="${errorTelefono}"></span>
					</div>

				</div>

				<div class="mb-4">

					<label class="form-label fw-bold">

						Correo :

					</label>

					<input id="correo" class="form-control" th:field="*{correo}" placeholder="Ingrese el correo">

					<div id="errorCorreo" th:if="${errorCorreo}" class="text-danger mt-1">
						<span th:text="${errorCorreo}"></span>
					</div>

				</div>

				<div class="d-flex gap-2">

					<button class="btn btn-success">

						Guardar

					</button>

					<a href="/clientes" class="btn btn-secondary">

						Volver

					</a>

				</div>

			</form>

		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

	<script>

		$(function () {

			$("#frmCliente").validate({

				rules: {

					nombre: {
						required: true
					},

					dni: {
						required: true,
						digits: true,
						minlength: 8,
						maxlength: 8
					},

					telefono: {
						required: true,
						digits: true,
						minlength: 9,
						maxlength: 9
					},

					correo: {
						required: true,
						email: true
					}

				},

				messages: {

					nombre: {
						required: "Ingrese el nombre del cliente."
					},

					dni: {
						required: "Ingrese el DNI.",
						digits: "Solo se permiten números.",
						minlength: "El DNI debe tener 8 dígitos.",
						maxlength: "El DNI debe tener 8 dígitos."
					},

					telefono: {
						required: "Ingrese el teléfono.",
						digits: "Solo se permiten números.",
						minlength: "El teléfono debe tener 9 dígitos.",
						maxlength: "El teléfono debe tener 9 dígitos."
					},

					correo: {
						required: "Ingrese el correo.",
						email: "Ingrese un correo válido."
					}

				},

				errorClass: "text-danger",

				highlight: function (element) {

					$(element).addClass("is-invalid");

				},

				unhighlight: function (element) {

					$(element).removeClass("is-invalid");

				}

			});

			$(".form-control").on("input", function () {

			    $("#errorDni").hide();

			    $("#errorTelefono").hide();

			    $("#errorCorreo").hide();

			});

		});


	</script>

</body>

</html>
