<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<title>Cliente</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


	<div class="container mt-4">


		<h2>Nuevo Cliente</h2>


		<form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">


			<input class="form-control mb-2" placeholder="Nombre" th:field="*{nombre}">



			<input class="form-control mb-2" placeholder="DNI" th:field="*{dni}">



			<input class="form-control mb-2" placeholder="Telefono" th:field="*{telefono}">



			<input class="form-control mb-2" placeholder="Correo" th:field="*{correo}">


			<button class="btn btn-success">

				Guardar

			</button>


		</form>


	</div>


</body>


</html>
