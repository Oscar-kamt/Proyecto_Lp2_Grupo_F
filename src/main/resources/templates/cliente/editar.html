<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<title>Editar Cliente</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		.form-control {

			border: 2px solid #6c757d;

		}

		.form-control:focus {

			border-color: #212529;
			box-shadow: none;

		}
	</style>

</head>


<body>


	<div class="container mt-4">

		<div class="card shadow p-4">

			<h2 class="mb-4">
				Editar Cliente
			</h2>


			<form id="frmCliente" th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

				<input type="hidden" th:field="*{id}">

				<div class="mb-3">

					<label class="form-label fw-bold">
						Nombre :
					</label>

					<input class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre">

				</div>



				<div class="mb-3">

					<label class="form-label fw-bold">
						DNI :
					</label>

					<input class="form-control" th:field="*{dni}" placeholder="Ingrese el DNI">

				</div>



				<div class="mb-3">

					<label class="form-label fw-bold">
						Teléfono :
					</label>

					<input class="form-control" th:field="*{telefono}" placeholder="Ingrese el teléfono">
				</div>



				<div class="mb-3">

					<label class="form-label fw-bold">
						Correo :
					</label>

					<input class="form-control" th:field="*{correo}" placeholder="Ingrese el Correo">

				</div>

				<div th:if="${errorGeneral}" class="alert alert-danger mt-3">

				    <span th:text="${errorGeneral}"></span>

				</div>

				<div class="d-flex gap-2">

					<button class="btn btn-success">

						Guardar Cambios

					</button>

					<a th:href="@{/clientes/eliminar/{id}(id=*{id})}" class="btn btn-danger"
						onclick="return confirm('¿Está seguro de eliminar este cliente?');">

						Eliminar

					</a>

					<a href="/clientes" class="btn btn-secondary">

						Volver

					</a>

				</div>


			</form>

		</div>

	</div>
	
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

	<script>

	$(function(){

	    $("#frmCliente").validate({

	        rules:{

	            nombre:{
	                required:true
	            },

	            dni:{
	                required:true,
	                digits:true,
	                minlength:8,
	                maxlength:8
	            },

	            telefono:{
	                required:true,
	                digits:true,
	                minlength:9,
	                maxlength:9
	            },

	            correo:{
	                required:true,
	                email:true
	            }

	        },

	        messages:{

	            nombre:{
	                required:"Ingrese el nombre del cliente."
	            },

	            dni:{
	                required:"Ingrese el DNI.",
	                digits:"Solo se permiten números.",
	                minlength:"El DNI debe tener 8 dígitos.",
	                maxlength:"El DNI debe tener 8 dígitos."
	            },

	            telefono:{
	                required:"Ingrese el teléfono.",
	                digits:"Solo se permiten números.",
	                minlength:"El teléfono debe tener 9 dígitos.",
	                maxlength:"El teléfono debe tener 9 dígitos."
	            },

	            correo:{
	                required:"Ingrese el correo.",
	                email:"Ingrese un correo válido."
	            }

	        },

	        errorClass:"text-danger",

	        highlight:function(element){

	            $(element).addClass("is-invalid");

	        },

	        unhighlight:function(element){

	            $(element).removeClass("is-invalid");

	        }

	    });

	});

	</script>
	
</body>


</html>
