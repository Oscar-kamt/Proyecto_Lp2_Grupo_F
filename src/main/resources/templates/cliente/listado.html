<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<meta charset="UTF-8">

	<title>Clientes</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>



<body>


	<nav class="navbar navbar-dark bg-dark">


			<div class="container">


				<a class="navbar-brand" href="/">
					🛍 Tienda Ropa
				</a>



				<div>


					<a href="/" class="btn btn-outline-light">
						Inicio
					</a>


					<a href="/productos" class="btn btn-outline-light">
						Productos
					</a>


					<a href="/categorias" class="btn btn-outline-light">
						Categorias
					</a>


					<a href="/clientes" class="btn btn-outline-light">
						Clientes
					</a>


					<a href="/ventas" class="btn btn-outline-light">
						Ventas
					</a>


				</div>



			</div>


		</nav>






	<div class="container mt-4">



		<div class="card shadow p-4">





			<div class="d-flex justify-content-between">


				<h2>Clientes</h2>


				<a href="/clientes/nuevo" class="btn btn-primary">

					+ Nuevo Cliente

				</a>


			</div>







			<form action="/clientes/buscar" method="get" class="row mt-3 mb-3">



				<div class="col">


					<input class="form-control" name="nombre" placeholder="Buscar cliente">


				</div>



				<div class="col-auto">


					<button class="btn btn-dark">

						🔎

					</button>


				</div>


			</form>








			<table class="table table-hover">



				<thead class="table-dark">


					<tr>

						<th>ID</th>

						<th>Nombre</th>

						<th>DNI</th>

						<th>Teléfono</th>

						<th>Correo</th>


					</tr>


				</thead>







				<tbody>


					<tr th:each="c:${clientes}">


						<td th:text="${c.id}"></td>


						<td th:text="${c.nombre}"></td>


						<td th:text="${c.dni}"></td>


						<td th:text="${c.telefono}"></td>


						<td th:text="${c.correo}"></td>


					</tr>



				</tbody>



			</table>





		</div>



	</div>




</body>

</html>
