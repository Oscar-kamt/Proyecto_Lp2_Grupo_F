<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<meta charset="UTF-8">

	<title>Clientes</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>



<body>

	<div th:replace="fragments/navbar :: navbar"></div>



	<div class="container mt-4">



		<div class="card shadow p-4">





			<div class="d-flex justify-content-between">


				<h2>Clientes</h2>


				<a href="/clientes/nuevo" class="btn btn-primary">

					+ Nuevo Cliente

				</a>


			</div>







			<form id="frmBuscar" action="/clientes/buscar" method="get" class="mt-3 mb-3">

				<div class="input-group">

					<input type="text" id="dni" name="dni" class="form-control" placeholder="Ingrese el DNI del cliente"
						th:value="${param.dni}">

					<button class="btn btn-outline-secondary" type="button" id="btnLimpiar">

						<i class="bi bi-x-lg"></i>

					</button>

					<button class="btn btn-dark" type="submit">

						<i class="bi bi-search"></i>

					</button>

				</div>

			</form>








			<table class="table table-hover table-bordered align-middle">



				<thead class="table-dark">


					<tr>

						<th class="text-center">ID</th>

						<th>Nombre</th>

						<th>DNI</th>

						<th>Teléfono</th>

						<th>Correo</th>

						<th class="text-center">Acciones</th>


					</tr>


				</thead>







				<tbody>


					<tr th:each="c:${clientes}">


						<td class="text-center" th:text="${c.id}"></td>


						<td th:text="${c.nombre}"></td>


						<td th:text="${c.dni}"></td>


						<td th:text="${c.telefono}"></td>


						<td th:text="${c.correo}"></td>

						<td class="text-center">

							<a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-secondary btn-sm"
								title="Editar">

								<i class="bi bi-pencil-square"></i>

							</a>

						</td>


					</tr>



				</tbody>



			</table>



			<div class="d-flex justify-content-end gap-2 mt-4">

				<a href="/" class="btn btn-secondary">

					← Volver

				</a>

			</div>

		</div>



	</div>


	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

	<script>

		$(function () {

			$("#frmBuscar").validate({

				rules: {

					dni: {
						required: true,
						digits: true,

					}

				},

				messages: {

					dni: {
						required: "Ingrese el DNI del cliente.",
						digits: "Solo se permiten números.",

					}

				},

				errorClass: "text-danger",

				errorPlacement: function (error, element) {

					error.insertAfter(element.closest(".input-group"));

				},

				highlight: function (element) {

					$(element).addClass("is-invalid");

				},

				unhighlight: function (element) {

					$(element).removeClass("is-invalid");

				}

			});

			$("#btnLimpiar").click(function () {

				$("#dni").val("");

				window.location.href = "/clientes";

			});

		});

	</script>

</body>

</html>
