<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<title>Categorías</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>




	<nav class="navbar navbar-dark bg-dark">


		<div class="container">


			<a class="navbar-brand" href="/">
				🛍 Tienda Ropa
			</a>



			<div>


				<a href="/" class="btn btn-outline-light">
					Inicio
				</a>


				<a href="/productos" class="btn btn-outline-light">
					Productos
				</a>


				<a href="/categorias" class="btn btn-outline-light">
					Categorias
				</a>


				<a href="/clientes" class="btn btn-outline-light">
					Clientes
				</a>


				<a href="/ventas" class="btn btn-outline-light">
					Ventas
				</a>


			</div>



		</div>


	</nav>







	<div class="container mt-4">



		<div class="card shadow p-4">



			<div class="d-flex justify-content-between">


				<h2>Categorías</h2>



				<a href="/categorias/nuevo" class="btn btn-primary">

					+ Nueva

				</a>


			</div>







			<table class="table table-hover table-bordered mt-3 align-middle">


				<thead class="table-dark">


					<tr>

						<th>ID</th>

						<th>Nombre</th>

						<th>Acciones</th>

					</tr>


				</thead>





				<tbody>


					<tr th:each="c:${categorias}">


						<td th:text="${c.id}"></td>


						<td th:text="${c.nombre}"></td>

						<td class="text-center">

							<a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn btn-secondary btn-sm"
								title="Editar">

								<i class="bi bi-pencil-square"></i>

							</a>

						</td>


					</tr>


				</tbody>



			</table>




		</div>


	</div>





</body>


</html>
