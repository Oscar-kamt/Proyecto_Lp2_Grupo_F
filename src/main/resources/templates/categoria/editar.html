<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<title>Editar Categoría</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		.form-control {

			border: 2px solid #6c757d;

		}

		.form-control:focus {

			border-color: #212529;
			box-shadow: none;

		}
	</style>

</head>


<body>


	<div th:replace="fragments/navbar :: navbar"></div>

	<div class="container mt-4">

		<div class="card shadow p-4">

			<h2 class="mb-4">
				Editar Categoría
			</h2>

			<form id="frmCategoria" th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">

				<input type="hidden" th:field="*{id}">

				<div class="mb-4">

					<label class="form-label fw-bold">
						Nombre :
					</label>

					<input class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre de la categoría">

				</div>

				<div th:if="${errorGeneral}" class="alert alert-danger mt-3">

					<span th:text="${errorGeneral}"></span>

				</div>

				<div class="d-flex gap-2">

					<button class="btn btn-success">

						Guardar Cambios

					</button>

					<a th:href="@{/categorias/eliminar/{id}(id=*{id})}" class="btn btn-danger"
						onclick="return confirm('¿Está seguro de eliminar esta categoría?');">

						Eliminar

					</a>

					<a href="/categorias" class="btn btn-secondary">

						Volver

					</a>

				</div>

			</form>


		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

	<script>

		$(function () {

			$("#frmCategoria").validate({

				rules: {

					nombre: {
						required: true
					}

				},

				messages: {

					nombre: {
						required: "Ingrese el nombre de la categoría."
					}

				},

				errorClass: "text-danger",

				highlight: function (element) {

					$(element).addClass("is-invalid");

				},

				unhighlight: function (element) {

					$(element).removeClass("is-invalid");

				}

			});

		});

	</script>

</body>

</html>
