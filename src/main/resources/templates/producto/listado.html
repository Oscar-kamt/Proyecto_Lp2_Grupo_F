<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<meta charset="UTF-8">

	<title>Productos</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>



<body>


	<nav class="navbar navbar-dark bg-dark">


		<div class="container">


			<a class="navbar-brand" href="/">
				🛍 Tienda Ropa
			</a>



			<div>


				<a href="/" class="btn btn-outline-light">
					Inicio
				</a>


				<a href="/productos" class="btn btn-outline-light">
					Productos
				</a>


				<a href="/categorias" class="btn btn-outline-light">
					Categorias
				</a>


				<a href="/clientes" class="btn btn-outline-light">
					Clientes
				</a>


				<a href="/ventas" class="btn btn-outline-light">
					Ventas
				</a>


			</div>



		</div>


	</nav>






	<div class="container mt-4">



		<div class="card shadow p-4">



			<div class="d-flex justify-content-between">


				<h2>Productos</h2>


				<a href="/productos/nuevo" class="btn btn-primary">

					+ Nuevo Producto

				</a>


			</div>







			<form id="frmBuscar" action="/productos/buscar" method="get" class="mt-3 mb-3">

				<div class="input-group">

					<input type="text" id="nombre" name="nombre" class="form-control" placeholder="Buscar producto"
						th:value="${param.nombre}">
					<button class="btn btn-outline-secondary" type="button" id="btnLimpiar">

						<i class="bi bi-x-lg"></i>

					</button>

					<button class="btn btn-dark" type="submit">

						<i class="bi bi-search"></i>

					</button>

				</div>

			</form>









			<table class="table table-hover table-bordered">


				<thead class="table-dark">


					<tr>

						<th>ID</th>

						<th>Nombre</th>

						<th>Marca</th>

						<th>Categoría</th>

						<th>Talla</th>


						<th>Precio</th>

						<th>Stock</th>

						<th>Acciones</th>


					</tr>


				</thead>





				<tbody>


					<tr th:each="p:${productos}">


						<td th:text="${p.id}"></td>


						<td th:text="${p.nombre}"></td>


						<td th:text="${p.marca}"></td>




						<td th:text="${p.categoria.nombre}"></td>



						<td th:text="${p.talla}"></td>





						<td>

							S/

							<span th:text="${p.precio}"></span>

						</td>



						<td th:text="${p.stock}"></td>


						<td class="text-center">

							<a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-secondary btn-sm"
								title="Editar">

								<i class="bi bi-pencil-square"></i>

							</a>

						</td>

					</tr>


				</tbody>



			</table>




		</div>



	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	
	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
	
	<script>

		$(function(){

		    $("#frmBuscar").validate({

		        rules:{

		            nombre:{
		                required:true
		            }

		        },

		        messages:{

		            nombre:{
		                required:"Ingrese el nombre del producto."
		            }

		        },

				errorClass:"text-danger",

				highlight:function(element){

				    $(element).addClass("is-invalid");

				},

				unhighlight:function(element){

				    $(element).removeClass("is-invalid");

				},

				errorPlacement:function(error, element){

				    if(element.parent(".input-group").length){

				        error.insertAfter(element.parent());

				    }else{

				        error.insertAfter(element);

				    }

				}

		    });

		    $("#btnLimpiar").click(function(){

		        $("#nombre").val("");

		        window.location.href="/productos";

		    });

		});

	</script>
	
</body>


</html>
