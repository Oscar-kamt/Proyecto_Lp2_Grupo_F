<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<meta charset="UTF-8">

	<title>Productos</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>



<body>


	<nav class="navbar navbar-dark bg-dark">


		<div class="container">


			<a class="navbar-brand" href="/">
				🛍 Tienda Ropa
			</a>



			<div>


				<a href="/" class="btn btn-outline-light">
					Inicio
				</a>


				<a href="/productos" class="btn btn-outline-light">
					Productos
				</a>


				<a href="/categorias" class="btn btn-outline-light">
					Categorias
				</a>


				<a href="/clientes" class="btn btn-outline-light">
					Clientes
				</a>


				<a href="/ventas" class="btn btn-outline-light">
					Ventas
				</a>


			</div>



		</div>


	</nav>






	<div class="container mt-4">



		<div class="card shadow p-4">



			<div class="d-flex justify-content-between">


				<h2>Productos</h2>


				<a href="/productos/nuevo" class="btn btn-primary">

					+ Nuevo Producto

				</a>


			</div>







			<form action="/productos/buscar" method="get" class="row mt-3 mb-3">


				<div class="col">


					<input class="form-control" name="nombre" placeholder="Buscar producto">


				</div>


				<div class="col-auto">


					<button class="btn btn-dark">

						🔎

					</button>


				</div>


			</form>









			<table class="table table-hover table-bordered">


				<thead class="table-dark">


					<tr>

						<th>ID</th>

						<th>Nombre</th>

						<th>Marca</th>

						<th>Categoría</th>

						<th>Talla</th>


						<th>Precio</th>

						<th>Stock</th>


					</tr>


				</thead>





				<tbody>


					<tr th:each="p:${productos}">


						<td th:text="${p.id}"></td>


						<td th:text="${p.nombre}"></td>


						<td th:text="${p.marca}"></td>




						<td th:text="${p.categoria.nombre}"></td>



						<td th:text="${p.talla}"></td>





						<td>

							S/

							<span th:text="${p.precio}"></span>

						</td>



						<td th:text="${p.stock}"></td>



					</tr>


				</tbody>



			</table>




		</div>



	</div>


</body>


</html>
