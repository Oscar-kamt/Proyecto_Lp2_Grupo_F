<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Editar Producto</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		.form-control,
		.form-select {

			border: 2px solid #6c757d;

		}

		.form-control:focus,
		.form-select:focus {

			border-color: #212529;
			box-shadow: none;

		}
	</style>

</head>

<body>

	<nav class="navbar navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand" href="/">
				🛍 Tienda Ropa
			</a>

		</div>

	</nav>

	<div class="container mt-4">

		<div class="card shadow p-4">

			<h2 class="mb-4">
				Editar Producto
			</h2>

			<form id="frmProducto" th:action="@{/productos/guardar}" th:object="${producto}" method="post">

				<input type="hidden" th:field="*{id}">

				<div class="mb-3">

					<label class="form-label fw-bold">
						Nombre :
					</label>

					<input class="form-control" th:field="*{nombre}">

				</div>

				<div class="mb-3">

					<label class="form-label fw-bold">
						Marca :
					</label>

					<input class="form-control" th:field="*{marca}">

				</div>

				<div class="mb-3">

					<label class="form-label fw-bold">
						Categoría :
					</label>

					<select class="form-select" th:field="*{categoria}">

						<option value="">
							Seleccione Categoría :
						</option>

						<option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nombre}">
						</option>

					</select>

				</div>

				<div class="mb-3">

					<label class="form-label fw-bold">
						Talla :
					</label>

					<input class="form-control" th:field="*{talla}">

				</div>

				<div class="mb-3">

					<label class="form-label fw-bold">
						Precio :
					</label>

					<input type="number" class="form-control" th:field="*{precio}" placeholder="Ingrese el precio"
						step="0.01" min="0.01">

				</div>

				<div class="mb-4">

					<label class="form-label fw-bold">
						Stock :
					</label>

					<input type="number" class="form-control" th:field="*{stock}" placeholder="Ingrese el stock"
						min="0">

				</div>

				<div class="d-flex gap-2">

					<button class="btn btn-success">

						Guardar Cambios

					</button>

					<a th:href="@{/productos/eliminar/{id}(id=*{id})}" class="btn btn-danger"
						onclick="return confirm('¿Está seguro de eliminar este producto?');">

						Eliminar

					</a>

					<a href="/productos" class="btn btn-secondary">

						Volver

					</a>

				</div>

				<div th:if="${errorGeneral}" class="alert alert-danger mt-3">

					<span th:text="${errorGeneral}"></span>

				</div>

			</form>

		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

	<script>

		$(function () {

			$("#frmProducto").validate({

				rules: {

					nombre: {
						required: true
					},

					marca: {
						required: true
					},

					categoria: {
						required: true
					},

					talla: {
						required: true
					},

					precio: {
						required: true,
						number: true,
						min: 0.01
					},

					stock: {
						required: true,
						digits: true,
						min: 0
					}

				},

				messages: {

					nombre: {
						required: "Ingrese el nombre del producto."
					},

					marca: {
						required: "Ingrese la marca del producto."
					},

					categoria: {
						required: "Seleccione una categoría."
					},

					talla: {
						required: "Ingrese una talla."
					},

					precio: {
						required: "Ingrese el precio.",
						number: "Ingrese un número válido.",
						min: "El precio debe ser mayor a 0."
					},

					stock: {
						required: "Ingrese el stock.",
						digits: "Solo se permiten números enteros.",
						min: "El stock no puede ser negativo."
					}

				},

				errorClass: "text-danger",

				highlight: function (element) {

					$(element).addClass("is-invalid");

				},

				unhighlight: function (element) {

					$(element).removeClass("is-invalid");

				}

			});

		});

	</script>

</body>

</html>
