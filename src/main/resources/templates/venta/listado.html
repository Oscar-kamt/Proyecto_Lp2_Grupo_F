<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<meta charset="UTF-8">

	<title>Ventas</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body>


	<!-- NAVBAR -->

	<nav class="navbar navbar-dark bg-dark">


		<div class="container">


			<a class="navbar-brand" href="/">
				🛍 Tienda Ropa
			</a>



			<div>


				<a href="/" class="btn btn-outline-light">
					Inicio
				</a>


				<a href="/productos" class="btn btn-outline-light">
					Productos
				</a>


				<a href="/categorias" class="btn btn-outline-light">
					Categorias
				</a>


				<a href="/clientes" class="btn btn-outline-light">
					Clientes
				</a>


				<a href="/ventas" class="btn btn-outline-light">
					Ventas
				</a>


			</div>



		</div>


	</nav>





	<div class="container mt-4">



		<h2>Lista de Ventas</h2>



		<a href="/ventas/nuevo" class="btn btn-primary mb-3">

			Nueva Venta

		</a>





		<table class="table table-striped table-bordered">


			<thead>


				<tr>

					<th>ID</th>

					<th>Fecha</th>

					<th>Cliente</th>

					<th>Producto</th>

					<th>Cantidad</th>

					<th>Total</th>


				</tr>


			</thead>





			<tbody>


				<tr th:each="v:${ventas}">



					<td th:text="${v.id}"></td>



					<td th:text="${v.fecha}"></td>





					<!-- CLIENTE -->

					<td>


						<span th:if="${v.cliente != null}" th:text="${v.cliente.nombre}">

						</span>


						<span th:if="${v.cliente == null}" class="text-danger">

							Sin cliente

						</span>


					</td>





					<!-- PRODUCTO -->

					<td>


						<span th:if="${v.producto != null}" th:text="${v.producto.nombre}">

						</span>


						<span th:if="${v.producto == null}" class="text-danger">

							Sin producto

						</span>


					</td>





					<td th:text="${v.cantidad}"></td>





					<td>

						S/

						<span th:text="${v.total}"></span>


					</td>





				</tr>



			</tbody>



		</table>



	</div>




</body>


</html>
