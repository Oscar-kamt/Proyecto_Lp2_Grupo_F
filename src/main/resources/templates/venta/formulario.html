<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Registrar Nueva Venta</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {

			background: #f5f6fa;

		}

		.form-control,
		.form-select {

			border: 2px solid #6c757d;

		}

		.form-control:focus,
		.form-select:focus {

			border-color: #212529;
			box-shadow: none;

		}

		.card {

			border: none;
			border-radius: 15px;

		}
	</style>

</head>

<body>

	<nav class="navbar navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand" href="/">

				🛍 Tienda Ropa

			</a>

		</div>

	</nav>



	<div class="container mt-4">

		<div class="card shadow p-4">

			<h2 class="mb-4">

				Registrar Nueva Venta

			</h2>



			<div class="row">

				<!-- CLIENTE -->

				<div class="col-md-6">

					<div class="card shadow-sm p-3 h-100">

						<h5 class="mb-4">

							👤 Datos del Cliente

						</h5>

						<label class="form-label fw-bold">

							DNI

						</label>

						<div class="input-group mb-4">

							<input type="text" id="dni" class="form-control" placeholder="Ingrese el DNI">

							<button type="button" class="btn btn-primary" id="btnBuscar">

								Buscar

							</button>

						</div>

						<label class="form-label fw-bold">

							Cliente

						</label>

						<input id="cliente" class="form-control" readonly>

					</div>

				</div>



				<!-- PRODUCTO -->

				<div class="col-md-6">

					<div class="card shadow-sm p-3 h-100">

						<h5 class="mb-4">

							👕 Datos del Producto

						</h5>

						<label class="form-label fw-bold">

							Producto

						</label>

						<select class="form-select mb-4">

							<option>

								Seleccione un producto

							</option>

						</select>

						<label class="form-label fw-bold">

							Cantidad

						</label>

						<input type="number" class="form-control mb-4">

						<button class="btn btn-success align-self-start">

							Agregar Producto

						</button>

					</div>

				</div>

			</div>



			<div class="card shadow-sm mt-4 p-3">

				<h5 class="mb-3">

					🛒 Detalle de la Venta

				</h5>

				<table class="table table-bordered table-hover align-middle">

					<thead class="table-dark">

						<tr>

							<th>Producto</th>

							<th width="120">Cantidad</th>

							<th width="150">Precio</th>

							<th width="150">Subtotal</th>

							<th width="120">Acción</th>

						</tr>

					</thead>

					<tbody>

					</tbody>

				</table>



				<div class="text-end">

					<h3 class="fw-bold">

						Total : S/ 0.00

					</h3>

				</div>

			</div>



			<div class="d-flex justify-content-end gap-2 mt-4">

				<a href="/" class="btn btn-secondary">

					Volver

				</a>

				<button class="btn btn-success">

					Generar Venta
					
				</button>

			</div>

		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script>

		$(function () {

			$("#btnBuscar").click(function () {

				let dni = $("#dni").val();

				$.get("/ventas/buscarCliente", {dni: dni}, function (data) {

					if (data == "") {

						$("#cliente").val("Cliente no encontrado");

						return;

					}

					$("#cliente").val(data);

				});

			});

		});

	</script>

</body>

</html>
