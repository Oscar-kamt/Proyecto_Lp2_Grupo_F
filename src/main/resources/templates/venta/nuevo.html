<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

	<meta charset="UTF-8">

	<title>Nueva Venta</title>


	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>



<body>


	<nav class="navbar navbar-dark bg-dark">

		<div class="container">


			<a class="navbar-brand" href="/">
				🛍 Tienda Ropa
			</a>


			<a href="/ventas" class="btn btn-outline-light">
				Volver
			</a>


		</div>


	</nav>





	<div class="container mt-5">



		<div class="card shadow">


			<div class="card-body">



				<h2 class="mb-4">
					Registrar Venta
				</h2>




				<form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">





					<div class="mb-3">

						<label class="form-label">
							Fecha
						</label>


						<input type="date" class="form-control" th:field="*{fecha}">

					</div>





					<div class="mb-3">

						<label class="form-label">
							Cantidad
						</label>


						<input type="number" class="form-control" th:field="*{cantidad}">


					</div>





					<div class="mb-3">

						<label class="form-label">
							Total
						</label>


						<input type="number" step="0.01" class="form-control" th:field="*{total}">


					</div>





					<div class="mb-3">

						<label class="form-label">
							Cliente
						</label>


						<select class="form-select" th:field="*{cliente}">


							<option value="">
								Seleccione Cliente
							</option>


							<option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nombre}">

							</option>


						</select>


					</div>







					<div class="mb-3">

						<label class="form-label">
							Producto
						</label>


						<select class="form-select" th:field="*{producto}">


							<option value="">
								Seleccione Producto
							</option>


							<option th:each="p:${productos}" th:value="${p.id}" th:text="${p.nombre}">

							</option>


						</select>


					</div>







					<button class="btn btn-success">

						Guardar Venta

					</button>


					<a href="/ventas" class="btn btn-secondary">

						Cancelar

					</a>




				</form>




			</div>

		</div>


	</div>




</body>

</html>
