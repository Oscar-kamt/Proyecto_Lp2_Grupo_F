<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	
	<div th:replace="fragments/navbar :: navbar"></div>

	<meta charset="UTF-8">

	<title>Reporte de Ventas</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

	<div class="container mt-4">

		<h2 class="mb-4">

			📋 Reporte de Ventas

		</h2>

		<table class="table table-striped table-hover align-middle shadow-sm">

			<thead class="table-dark">

				<tr>

					<th>N° Boleta</th>

					<th>Fecha</th>

					<th>Cliente</th>

					<th th:if="${usuario.rol=='ADMIN'}">

					    Vendedor

					</th>

					<th>Total</th>

					<th>Acción</th>

				</tr>

			</thead>

			<tbody>

				<tr th:each="v : ${ventas}">

					<td th:text="${v.numeroBoleta}"></td>

					<td th:text="${v.fecha}"></td>

					<td th:text="${v.cliente.nombre}"></td>

					<td
					    th:if="${usuario.rol=='ADMIN'}"
					    th:text="${v.usuario.usuario}">
					</td>

					<td>

					    S/

					    <span th:text="${#numbers.formatDecimal(v.total,1,2)}"></span>

					<td>

					    <a th:href="@{/ventas/boleta/{id}(id=${v.id})}"
					       class="btn btn-primary btn-sm">

					        👁 Ver

					    </a>

					    <a th:href="@{/reporte/boleta/{id}(id=${v.id})}"
					       target="_blank"
					       class="btn btn-danger btn-sm ms-1">

					        📄 PDF

					    </a>

					</td>

				</tr>

			</tbody>

		</table>
		
		<div class="d-flex justify-content-end gap-2 mt-4">

		<a href="/" class="btn btn-secondary">

			← Volver

		</a>
		
		</div>

	</div>

</body>

</html>
