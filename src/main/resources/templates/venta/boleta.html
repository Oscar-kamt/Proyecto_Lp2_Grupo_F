<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Boleta de Venta</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {

			background: #f4f6f9;

		}

		.card {

			max-width: 950px;

			margin: auto;

			margin-top: 35px;

			margin-bottom: 35px;

			border: none;

			border-radius: 18px;

		}

		table th {

			background: #212529;

			color: white;

			text-align: center;

		}

		table td {

			text-align: center;

			vertical-align: middle;

		}

		.titulo {

			font-size: 40px;

			font-weight: bold;

		}

		.subtitulo {

			font-size: 22px;

			font-weight: bold;

			color: #6c757d;

		}

		.total {

			font-size: 38px;

			font-weight: bold;

			color: #198754;

		}

		.info b {

			display: inline-block;

			width: 110px;

		}
	</style>

</head>

<body>

	<div class="container">

		<div class="card shadow p-5">

			<div class="text-center">

				<div class="titulo">

					🛍 TIENDA ROPA

				</div>

				<div class="subtitulo">

					BOLETA DE VENTA

				</div>

			</div>

			<hr>

			<div class="row">

				<div class="col-md-6">

					<h4>

						Boleta N°

					</h4>

					<h3 class="text-primary" th:text="${venta.numeroBoleta}">

					</h3>

				</div>

				<div class="col-md-6 text-end">

					<h5>

						Fecha

					</h5>

					<h5 th:text="${venta.fecha}"></h5>

				</div>

			</div>

			<hr>

			<h3>

				Datos del Cliente

			</h3>

			<br>

			<div class="info">

				<p>

					<b>Nombre:</b>

					<span th:text="${venta.cliente.nombre}"></span>

				</p>

				<p>

					<b>DNI:</b>

					<span th:text="${venta.cliente.dni}"></span>

				</p>

				<p>

					<b>Correo:</b>

					<span th:text="${venta.cliente.correo}"></span>

				</p>

				<p>

					<b>Teléfono:</b>

					<span th:text="${venta.cliente.telefono}"></span>

				</p>

			</div>

			<hr>

			<h3>

				Detalle de la Venta

			</h3>

			<br>

			<table class="table table-bordered table-hover">

				<thead>

					<tr>

						<th>Producto</th>

						<th>Cantidad</th>

						<th>Precio Unitario</th>

						<th>Subtotal</th>

					</tr>

				</thead>

				<tbody>

					<tr th:each="d : ${detalle}">

						<td th:text="${d.producto.nombre}"></td>

						<td th:text="${d.cantidad}"></td>

						<td>
						    S/
						    <span th:text="${#numbers.formatDecimal(d.precio,1,2)}"></span>
						</td>

						<td>
						    S/
						    <span th:text="${#numbers.formatDecimal(d.subtotal,1,2)}"></span>
						</td>

					</tr>

				</tbody>

			</table>

			<div class="text-end mt-4">

				<h5>

					Cantidad de productos :

					<span th:text="${#aggregates.sum(detalle.![cantidad])}"></span>

				</h5>

				<br>

				<div class="total">

			</div>

			<hr>

			<div class="text-center">

				<h5>

					Gracias por su compra.

				</h5>

				<h6 class="text-muted">

					¡Vuelva pronto!

				</h6>

				<br>

				<a href="/ventas" class="btn btn-secondary btn-lg">

					← Volver al sistema

				</a>

			</div>

		</div>

	</div>

</body>

</html>
